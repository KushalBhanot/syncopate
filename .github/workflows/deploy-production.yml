name: Deploy production

# Production is never deployed automatically. Run this by hand on a commit that has been
# checked on staging. It uses the separate "production" GitHub environment, so it has its own
# HF_TOKEN secret and HF_SPACE variable, and can require an approval before it runs.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "production" to deploy this commit to production
        required: true

jobs:
  ci:
    if: inputs.confirm == 'production'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Deploy to Hugging Face Space
        id: deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Add the HF_TOKEN secret to the production environment"; exit 1; }
          test -n "$SPACE" || { echo "::error::Add the HF_SPACE variable to the production environment"; exit 1; }
          out=$(uv run --with huggingface_hub python deploy/deploy_space.py --space "$SPACE" --env production)
          echo "$out"
          echo "url=$(echo "$out" | grep -o 'https://[^ ]*')" >> "$GITHUB_OUTPUT"
