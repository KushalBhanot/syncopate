name: Promote to production

# Production is the `production` branch, which Vercel deploys to the production URL.
# It only moves when someone runs this by hand, after checking the change on staging
# (the `main` branch preview). Pick a commit to roll back.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to put in production
        required: true
        default: main
      confirm:
        description: Type "production" to confirm
        required: true

permissions:
  contents: write

jobs:
  ci:
    if: inputs.confirm == 'production'
    uses: ./.github/workflows/ci.yml

  promote:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Move the production branch
        run: |
          git push --force origin HEAD:refs/heads/production
          echo "production -> $(git rev-parse --short HEAD) ($(git log -1 --format=%s))" >> "$GITHUB_STEP_SUMMARY"
