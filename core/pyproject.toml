[project]
name = "syncopate"
version = "0.1.0"
description = "Lyrics that follow the performer: cue builder, live follower and stage displays"
readme = "README.md"
authors = [
    { name = "Kushal Bhanot", email = "developerkushalb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.0.1",
    "fastapi>=0.143.3",
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
syncopate = "syncopate:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
