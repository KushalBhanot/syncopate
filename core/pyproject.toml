[project]
name = "syncopate"
version = "0.1.0"
description = "Lyrics that follow the performer: cue builder, live follower and stage displays"
readme = "README.md"
authors = [
    { name = "Kushal Bhanot", email = "developerkushalb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
syncopate = "syncopate:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
# Vocal separation (HT Demucs): weight license unresolved, so commercial builds leave it out.
separation = [
    "demucs>=4.0.1",
]
# Qwen3-ForcedAligner (Apache-2.0): the commercial-path aligner.
qwen = [
    "qwen-asr>=0.0.6",
]

# Linux (the Docker image) gets CPU-only PyTorch: about 2 GB smaller than the CUDA build.
# macOS keeps the default wheels, which include Apple-GPU (MPS) support.
[tool.uv]
# Local development gets everything; the commercial image opts in group by group (see Dockerfile).
default-groups = ["dev", "separation", "qwen"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
